services:
  - type: web
    name: fpl-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.7
      - key: ODDS_API_KEY
        sync: false   # paste your The Odds API key in the Render dashboard
